# Site configuration
exclude:
  - README.md
  - LICENSE
  - CNAME
  - Gemfile
  - Gemfile.lock
  - garth-jekyll-theme.gemspec
  - _posts

sass:
  style: compressed
permalink: pretty
excerpt_separator: <!-- more -->
timezone: Europe/Berlin

collections:
  publications:
    title: Publications
    output: true
    permalink: /publications/:name
    description: "Selected research in visual localization, sensor fusion, and robust autonomous systems."

defaults:
  -
    scope:
      path: ""
      type: pages
    values:
      layout: page # Default layout
  -
    scope:
      path: ""
      type: publications
    values:
      layout: publication

encoding: utf-8
title: "Henry Hölzemann"
tagline: "Researcher in Sensor Fusion & Localization"
logo: "/assets/me.jpg"
favicon: "/assets/favicon.png"
description: "Researcher working on sensor fusion, visual localization, and robust navigation in challenging environments."
url: "https://hlzmnhnry.github.io"
baseurl: ""
lang: en-US
