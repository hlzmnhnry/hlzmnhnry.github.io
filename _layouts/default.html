<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    {% assign page_description = page.description | default: site.description | strip_html | strip_newlines %}
    <meta name="description" content="{{ page_description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
    {% if page.title and page.url != '/' %}
      <title>{{ page.title }} · {{ site.title }}</title>
    {% else %}
      <title>{{ site.title }} · {{ site.tagline }}</title>
    {% endif %}
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}">
    <meta property="og:description" content="{{ page_description | escape }}">
    <meta property="og:type" content="{% if page.collection == 'publications' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | default: site.logo | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">

    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('theme');
          var preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = savedTheme || preferredTheme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ site.favicon | relative_url }}">
    <link rel="apple-touch-icon" href="{{ site.favicon | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ content }}
    <script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
  </body>
</html>
